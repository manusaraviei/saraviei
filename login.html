<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Entrar | Saraviei
    </title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


    <main class="pagina-login">


        <section class="caixa-login">


            <a
                href="index.html"
                class="logo"
            >
                SARAVIEI
            </a>


            <span class="subtitulo">
                ÁREA DO CLIENTE
            </span>


            <h1>
                Bem-vindo de volta
            </h1>


            <p class="descricao">
                Entre na sua conta para acompanhar seus pedidos
                e personalizações.
            </p>


            <form id="form-login">


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="botao-entrar"
                >
                    Entrar
                </button>


                <p
                    id="mensagem"
                    class="mensagem"
                ></p>


            </form>


            <div class="divisor">

                <span>
                    ou
                </span>

            </div>


            <button
                type="button"
                class="botao-cadastro"
                onclick="window.location.href='cadastro.html'"
            >
                Criar minha conta
            </button>


            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar para a loja
            </a>


        </section>


    </main>


</body>

</html>
