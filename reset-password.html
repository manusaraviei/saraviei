<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Nova senha | Ateliê do Axé
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: #f2e5d1;

            background:
                radial-gradient(
                    circle at 50% 20%,
                    #4a321e 0%,
                    #21140c 45%,
                    #100b08 100%
                );
        }

        .card {
            width: 100%;
            max-width: 470px;

            padding: 50px 40px;

            background:
                linear-gradient(
                    145deg,
                    rgba(48, 31, 20, 0.96),
                    rgba(24, 15, 10, 0.98)
                );

            border:
                1px solid
                rgba(209, 170, 97, 0.28);

            border-radius: 22px;

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.55);

            text-align: center;
        }

        .logo {
            color: #d1aa61;

            font-size: 21px;

            font-weight: bold;

            letter-spacing: 3px;

            margin-bottom: 25px;
        }

        .linha {
            width: 70px;
            height: 1px;

            margin:
                0 auto 30px;

            background: #d1aa61;
        }

        h1 {
            color: #f2e5d1;

            font-size: 38px;

            font-weight: normal;

            margin-bottom: 15px;
        }

        p {
            color: #bfae99;

            font-size: 15px;

            line-height: 1.7;

            margin-bottom: 30px;
        }

        .campo {
            text-align: left;

            margin-bottom: 20px;
        }

        label {
            display: block;

            color: #e4d2b8;

            font-size: 14px;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 15px;

            color: #f5eadb;

            background:
                rgba(10, 7, 5, 0.75);

            border:
                1px solid
                rgba(209, 170, 97, 0.25);

            border-radius: 10px;

            outline: none;

            font-family: inherit;

            font-size: 15px;
        }

        input:focus {
            border-color: #d1aa61;

            box-shadow:
                0 0 0 3px
                rgba(209, 170, 97, 0.08);
        }

        button {
            width: 100%;

            padding: 16px;

            margin-top: 10px;

            border: none;

            border-radius: 35px;

            color: #1b1008;

            background: #d1aa61;

            font-family: inherit;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.3s,
                background 0.3s;
        }

        button:hover {
            transform: translateY(-3px);

            background: #e2c17e;
        }

        button:disabled {
            opacity: 0.6;

            cursor: wait;

            transform: none;
        }

        #mensagem {
            min-height: 24px;

            margin-top: 20px;

            color: #d8a6a6;
        }

    </style>

</head>

<body>

    <main class="card">

        <div class="logo">
            ATELIÊ DO AXÉ
        </div>

        <div class="linha"></div>

        <h1>
            Nova senha
        </h1>

        <p>
            Crie uma nova senha para acessar
            o painel administrativo.
        </p>

        <form id="form-senha">

            <div class="campo">

                <label for="senha">
                    Nova senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua nova senha"
                    required
                    minlength="6"
                >

            </div>

            <div class="campo">

                <label for="confirmar-senha">
                    Confirmar nova senha
                </label>

                <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Digite a senha novamente"
                    required
                    minlength="6"
                >

            </div>

            <button
                type="submit"
                id="botao"
            >
                Salvar nova senha
            </button>

            <p id="mensagem"></p>

        </form>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="reset-password.js"></script>

</body>

</html>
